<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Health Cockpit アプリアイコン (Claude Design 2026-07-05)
       maskable 対応: 背景は全面塗り、主要素は中央80%セーフゾーン内 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffa64f"/>
      <stop offset=".55" stop-color="#ff8a2a"/>
      <stop offset="1" stop-color="#f06d00"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe9d2"/>
    </linearGradient>
  </defs>

  <!-- 背景（全面・maskableセーフ） -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- 環境光のハイライト -->
  <circle cx="140" cy="110" r="300" fill="#ffffff" opacity=".10"/>
  <circle cx="420" cy="470" r="220" fill="#7a2f00" opacity=".10"/>

  <!-- スコアリング（軌道）: 未達部分 -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="26"/>
  <!-- スコアリング: 達成部分 78%（キリの悪さ＝現在進行形の努力を表す） -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#arc)" stroke-width="26"
          pathLength="100" stroke-dasharray="78 22" stroke-linecap="round"
          transform="rotate(-90 256 256)"/>
  <!-- 達成の起点ドット -->
  <circle cx="256" cy="106" r="13" fill="#ffffff"/>

  <!-- 参謀の「参」: 知性の中核 -->
  <text x="256" y="268" text-anchor="middle" dominant-baseline="middle"
        font-family="Hiragino Mincho ProN, Hiragino Kaku Gothic ProN, Yu Mincho, serif"
        font-size="168" font-weight="700" fill="#ffffff"
        style="paint-order: stroke; stroke: rgba(122,45,0,.18); stroke-width: 6;">参</text>
</svg>
