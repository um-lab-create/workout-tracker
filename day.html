<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="日次栄養">
  <meta name="theme-color" content="#0a0a0f">
  <title>日次栄養</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --ink: #f7f4ea;
      --muted: #aaa79d;
      --dim: #6f6d67;
      --line: rgba(255,255,255,.09);
      --panel: rgba(22,23,28,.84);
      --panel-strong: rgba(34,35,40,.96);
      --accent: #58d8ff;
      --accent-soft: rgba(88,216,255,.16);
      --accent-2: #c8ff42;
      --warn: #ffd15a;
      --ok: #42e79b;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --shadow: 0 22px 70px rgba(0,0,0,.42);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      min-height: 100vh;
      padding: calc(var(--safe-top) + 14px) 14px calc(var(--safe-bottom) + 100px);
      background:
        radial-gradient(760px 420px at 18% -10%, rgba(88,216,255,.14), transparent 58%),
        radial-gradient(620px 380px at 104% 18%, rgba(200,255,66,.10), transparent 60%),
        linear-gradient(145deg, #08090d 0%, #111218 58%, #08090d 100%);
    }

    button,
    input,
    a {
      font: inherit;
      color: inherit;
    }

    button {
      appearance: none;
      border: 0;
      background: none;
      padding: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    input {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(10,10,15,.9);
      color: var(--ink);
      border-radius: 999px;
      min-height: 36px;
      padding: 0 12px;
    }

    .app {
      width: min(100%, 560px);
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .brand-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .subtle-nav {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.05);
      color: var(--ink);
      font-size: 18px;
      font-weight: 900;
      flex: 0 0 auto;
    }

    .brand-main {
      font-size: 28px;
      line-height: 1;
      font-weight: 950;
      letter-spacing: -.03em;
    }

    .brand-sub {
      margin-top: 6px;
      color: var(--dim);
      font-size: 11px;
      font-weight: 800;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.05);
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }

    .hero,
    .panel {
      border: 1px solid var(--line);
      border-radius: 26px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.08), rgba(255,255,255,.02)),
        rgba(20,21,25,.84);
      box-shadow: var(--shadow);
    }

    .hero {
      padding: 16px;
      overflow: hidden;
      position: relative;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: -80px -74px auto auto;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(88,216,255,.22), transparent 68%);
      pointer-events: none;
    }

    .hero-head {
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .hero-copy h1 {
      margin: 0;
      font-size: 25px;
      line-height: 1.04;
      font-weight: 950;
      letter-spacing: -.03em;
    }

    .hero-copy p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      font-weight: 800;
    }

    .hero-mark {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--accent), #8ce8ff);
      color: #0a0a0f;
      font-size: 24px;
      font-weight: 950;
    }

    .date-row {
      position: relative;
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .date-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .date-value {
      font-size: 20px;
      font-weight: 950;
      line-height: 1.05;
    }

    .date-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .date-btn {
      min-height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.05);
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
    }

    .date-btn.active {
      color: var(--ink);
      border-color: rgba(88,216,255,.42);
      background: linear-gradient(145deg, rgba(88,216,255,.18), rgba(88,216,255,.08));
    }

    .hero-grid,
    .macro-grid,
    .nutrient-grid {
      display: grid;
      gap: 8px;
    }

    .hero-grid,
    .macro-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-top: 14px;
    }

    .hero-card,
    .macro-card,
    .timing-card {
      min-height: 88px;
      padding: 12px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.075);
      background: rgba(0,0,0,.22);
    }

    .card-label {
      color: var(--dim);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .card-value {
      margin-top: 8px;
      font-size: 23px;
      line-height: 1;
      font-weight: 950;
    }

    .card-copy {
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
      font-weight: 700;
    }

    .panel {
      margin-top: 14px;
      padding: 14px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 950;
    }

    .section-note {
      color: var(--dim);
      font-size: 11px;
      font-weight: 800;
    }

    .macro-card .card-value {
      color: var(--accent-2);
    }

    .nutrient-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .nutrient-card {
      padding: 12px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.075);
      background: rgba(0,0,0,.22);
    }

    .nutrient-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .nutrient-name {
      font-size: 14px;
      font-weight: 950;
    }

    .nutrient-target {
      color: var(--dim);
      font-size: 11px;
      font-weight: 800;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.05);
      color: var(--muted);
      font-size: 10px;
      font-weight: 950;
      white-space: nowrap;
    }

    .status-pill.low { color: var(--warn); border-color: rgba(255,209,90,.35); }
    .status-pill.ok { color: var(--ok); border-color: rgba(66,231,155,.35); }
    .status-pill.high { color: #ff8fa3; border-color: rgba(255,143,163,.35); }

    .nutrient-value {
      margin-top: 8px;
      font-size: 22px;
      line-height: 1;
      font-weight: 950;
    }

    .track {
      position: relative;
      overflow: hidden;
      height: 10px;
      margin-top: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
    }

    .fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(88,216,255,.95), rgba(200,255,66,.98));
    }

    .nutrient-meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.45;
    }

    .timing-grid {
      display: grid;
      gap: 8px;
    }

    .timing-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .timing-title {
      font-size: 15px;
      font-weight: 950;
    }

    .timing-copy {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      font-weight: 700;
    }

    .timing-badge {
      color: var(--accent);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .contrib-list {
      display: grid;
      gap: 8px;
    }

    .food-grid {
      display: grid;
      gap: 8px;
    }

    .suggest-grid {
      display: grid;
      gap: 8px;
    }

    .suggest-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 12px;
      border-radius: 18px;
      border: 1px solid rgba(255,209,90,.16);
      background: linear-gradient(145deg, rgba(255,209,90,.09), rgba(255,255,255,.035));
      text-decoration: none;
    }

    .suggest-title {
      font-size: 14px;
      line-height: 1.3;
      font-weight: 950;
    }

    .suggest-copy {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
      font-weight: 750;
    }

    .suggest-action {
      color: var(--warn);
      font-size: 12px;
      font-weight: 950;
      white-space: nowrap;
    }

    .food-card {
      padding: 12px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.075);
      background: rgba(255,255,255,.04);
      display: grid;
      gap: 10px;
    }

    .food-card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .food-name {
      font-size: 14px;
      line-height: 1.3;
      font-weight: 950;
    }

    .food-kcal {
      color: var(--accent-2);
      font-size: 13px;
      font-weight: 950;
      white-space: nowrap;
    }

    .food-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .food-tag {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 0 9px;
      border-radius: 999px;
      background: rgba(88,216,255,.12);
      border: 1px solid rgba(88,216,255,.16);
      color: var(--ink);
      font-size: 11px;
      font-weight: 850;
    }

    .contrib-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      min-height: 56px;
      padding: 12px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.075);
      background: rgba(255,255,255,.04);
    }

    .contrib-name {
      font-size: 13px;
      font-weight: 900;
    }

    .contrib-copy {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
      font-weight: 700;
    }

    .contrib-amount {
      color: var(--accent-2);
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .empty {
      color: var(--dim);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.5;
      text-align: center;
      padding: 10px 6px;
    }

    .dock {
      position: fixed;
      left: 14px;
      right: 14px;
      bottom: calc(var(--safe-bottom) + 14px);
      z-index: 40;
      width: min(calc(100% - 28px), 560px);
      margin: 0 auto;
      padding: 10px;
      border-radius: 24px;
      border: 1px solid var(--line);
      background: rgba(16,17,20,.92);
      backdrop-filter: blur(14px);
      box-shadow: 0 20px 60px rgba(0,0,0,.42);
    }

    .dock-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .dock-link {
      text-decoration: none;
    }

    .dock-btn {
      min-height: 56px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.06);
      background: rgba(255,255,255,.04);
      display: grid;
      place-items: center;
      gap: 2px;
      padding: 8px 4px;
      text-align: center;
    }

    .dock-btn strong {
      font-size: 18px;
      line-height: 1;
    }

    .dock-btn span {
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
    }

    .dock-btn.is-active {
      border-color: rgba(88,216,255,.28);
      background: rgba(88,216,255,.14);
    }

    @media (max-width: 600px) {
      .hero-grid,
      .macro-grid,
      .nutrient-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="brand-row">
          <button class="subtle-nav" type="button" onclick="backToMeal()">‹</button>
          <div>
            <div class="brand-main">日次栄養</div>
            <div class="brand-sub">PFC と主要栄養をその日単位で確認</div>
          </div>
        </div>
      </div>
      <div class="chip" id="coverageChip">栄養DB 0%</div>
    </header>

    <section class="hero">
      <div class="hero-head">
        <div class="hero-copy">
          <h1 id="selectedDateLabel">-</h1>
          <p>成人向けの暫定目安で表示。足りない栄養と、どの食品から入ったかを先に見る。</p>
        </div>
        <div class="hero-mark">栄</div>
      </div>

      <div class="date-row">
        <div class="date-head">
          <div class="date-controls">
            <button class="date-btn active" id="todayBtn" type="button" onclick="jumpDate(0)">今日</button>
            <button class="date-btn" id="yesterdayBtn" type="button" onclick="jumpDate(-1)">昨日</button>
          </div>
          <input id="dateInput" type="date">
        </div>
      </div>

      <div class="hero-grid">
        <div class="hero-card">
          <div class="card-label">kcal</div>
          <div class="card-value" id="heroKcal">0</div>
          <div class="card-copy" id="heroCount">0/3 食</div>
        </div>
        <div class="hero-card">
          <div class="card-label">PFC</div>
          <div class="card-value" id="heroPfc">0/0/0</div>
          <div class="card-copy">g ベース</div>
        </div>
        <div class="hero-card">
          <div class="card-label">見えてる栄養</div>
          <div class="card-value" id="heroCoverage">0%</div>
          <div class="card-copy">栄養DB カバー率</div>
        </div>
        <div class="hero-card">
          <div class="card-label">要確認</div>
          <div class="card-value" id="heroReview">0</div>
          <div class="card-copy">量が曖昧</div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="section-head">
        <div class="section-title">PFC</div>
        <div class="section-note">その日の合計</div>
      </div>
      <div class="macro-grid">
        <div class="macro-card">
          <div class="card-label">Protein</div>
          <div class="card-value" id="macroP">0g</div>
          <div class="card-copy" id="macroPSub">0%</div>
        </div>
        <div class="macro-card">
          <div class="card-label">Fat</div>
          <div class="card-value" id="macroF">0g</div>
          <div class="card-copy" id="macroFSub">0%</div>
        </div>
        <div class="macro-card">
          <div class="card-label">Carb</div>
          <div class="card-value" id="macroC">0g</div>
          <div class="card-copy" id="macroCSub">0%</div>
        </div>
        <div class="macro-card">
          <div class="card-label">Meals</div>
          <div class="card-value" id="macroMeals">0</div>
          <div class="card-copy">朝昼夜 + 下書き</div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="section-head">
        <div class="section-title">主要栄養</div>
        <div class="section-note">暫定目安つき</div>
      </div>
      <div class="nutrient-grid" id="nutrientGrid"></div>
    </section>

    <section class="panel">
      <div class="section-head">
        <div class="section-title">足す候補</div>
        <div class="section-note">不足から逆引き</div>
      </div>
      <div class="suggest-grid" id="suggestGrid"></div>
    </section>

    <section class="panel">
      <div class="section-head">
        <div class="section-title">食事ごとの中身</div>
        <div class="section-note">未保存下書きも含む</div>
      </div>
      <div class="timing-grid" id="timingGrid"></div>
    </section>

    <section class="panel">
      <div class="section-head">
        <div class="section-title">食品別</div>
        <div class="section-note">何が強いか</div>
      </div>
      <div class="food-grid" id="foodGrid"></div>
    </section>

    <section class="panel">
      <div class="section-head">
        <div class="section-title">食品ごとの寄与</div>
        <div class="section-note">どこから入ったか</div>
      </div>
      <div class="contrib-list" id="contribList"></div>
    </section>
  </main>

  <div class="dock">
    <div class="dock-grid">
      <a class="dock-link" href="index.html"><div class="dock-btn"><strong>◎</strong><span>ホーム</span></div></a>
      <a class="dock-link" href="meal.html"><div class="dock-btn"><strong>食</strong><span>食事</span></div></a>
      <a class="dock-link" href="day.html"><div class="dock-btn is-active"><strong>栄</strong><span>日次栄養</span></div></a>
      <a class="dock-link" href="workout.html"><div class="dock-btn"><strong>筋</strong><span>筋トレ</span></div></a>
    </div>
  </div>

  <script src="nutrition-db.js"></script>
  <script>
    'use strict';

    const RECORD_STORE = 'meal_recs_v3';
    const DRAFT_STORE = 'meal_draft_v4';
    const NUTRITION_DB = window.HSNutritionDB || null;
    const JAPANESE_DAYS = ['日', '月', '火', '水', '木', '金', '土'];
    const TIMING_LABELS = {
      morning: { label: '朝ごはん' },
      lunch: { label: '昼ごはん' },
      dinner: { label: '夜ごはん' }
    };
    const NUTRIENT_META = NUTRITION_DB ? NUTRITION_DB.META : {};

    let selectedDate = readInitialDate();

    boot();

    function boot() {
      bindDateControls();
      renderAll();
    }

    function readInitialDate() {
      const params = new URLSearchParams(window.location.search);
      const date = params.get('date');
      return date || todayStr();
    }

    function todayStr() {
      const d = new Date();
      return formatIsoDate(d);
    }

    function shiftDate(dateStr, offset) {
      const base = new Date(`${dateStr}T00:00:00`);
      base.setDate(base.getDate() + offset);
      return formatIsoDate(base);
    }

    function formatIsoDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function fmtDate(dateStr) {
      const d = new Date(`${dateStr}T00:00:00`);
      return `${d.getMonth() + 1}/${d.getDate()} (${JAPANESE_DAYS[d.getDay()]})`;
    }

    function storageGet(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch {
        return fallback;
      }
    }

    function bindDateControls() {
      document.getElementById('dateInput').addEventListener('change', event => {
        if (event.target.value) {
          selectedDate = event.target.value;
          renderAll();
        }
      });
    }

    function jumpDate(offset) {
      selectedDate = shiftDate(todayStr(), offset);
      renderAll();
    }

    function backToMeal() {
      if (document.referrer && document.referrer.includes(location.host) && window.history.length > 1) {
        window.history.back();
        return;
      }
      window.location.href = `meal.html?date=${encodeURIComponent(selectedDate)}`;
    }

    function getRecords() {
      return storageGet(RECORD_STORE, []);
    }

    function getDrafts() {
      return storageGet(DRAFT_STORE, {});
    }

    function draftKey(dateStr, timingKey) {
      return `${dateStr}:${timingKey}`;
    }

    function calcFoodPortion(food, qty, unitLabel) {
      if (!NUTRITION_DB || !food) return null;
      const portion = NUTRITION_DB.calcPortion(food, qty, unitLabel);
      if (!portion) return null;
      return {
        grams: portion.grams,
        nutrients: portion.totals,
        known: true
      };
    }

    function structureItem(item) {
      if (item && item.nutrients) return item;
      if (NUTRITION_DB) return NUTRITION_DB.structureItem(item, null);
      return null;
    }

    function getEntryItems(entry) {
      if (entry && Array.isArray(entry.structuredItems) && entry.structuredItems.length) {
        return entry.structuredItems.map(structureItem).filter(Boolean);
      }
      return ((entry && entry.items) || []).map(structureItem).filter(Boolean);
    }

    function buildDayState() {
      const records = getRecords().filter(record => record.date === selectedDate);
      const drafts = getDrafts();
      const timingState = { morning: null, lunch: null, dinner: null };

      records.forEach(record => {
        const items = getEntryItems(record);
        const totals = computeItemsSummary(items);
        timingState[record.timingKey] = {
          source: 'saved',
          title: TIMING_LABELS[record.timingKey]?.label || record.timing,
          memo: record.memo,
          kcal: totals.energy,
          p: totals.protein,
          f: totals.fat,
          c: totals.carb,
          items: items,
          reviewCount: totals.reviewCount
        };
      });

      Object.keys(TIMING_LABELS).forEach(timingKey => {
        if (timingState[timingKey]) return;
        const draft = drafts[draftKey(selectedDate, timingKey)];
        const items = getEntryItems(draft);
        if (!items.length) return;
        const totals = computeItemsSummary(items);
        timingState[timingKey] = {
          source: 'draft',
          title: TIMING_LABELS[timingKey].label,
          memo: summarizeItems(items),
          kcal: totals.energy,
          p: totals.protein,
          f: totals.fat,
          c: totals.carb,
          items: items,
          reviewCount: totals.reviewCount
        };
      });

      const totals = { kcal: 0, p: 0, f: 0, c: 0, reviewCount: 0, meals: 0 };
      const nutrients = NUTRITION_DB ? NUTRITION_DB.blankNutrients() : {};
      const contributions = {};
      const foodTotals = {};
      Object.keys(NUTRIENT_META).forEach(key => {
        contributions[key] = {};
      });
      let knownItems = 0;
      let totalItems = 0;

      Object.entries(timingState).forEach(([timingKey, entry]) => {
        if (!entry) return;
        totals.kcal += entry.kcal;
        totals.p += entry.p;
        totals.f += entry.f;
        totals.c += entry.c;
        totals.reviewCount += entry.reviewCount || 0;
        totals.meals += 1;

        (entry.items || []).forEach(item => {
          totalItems += 1;
          const portion = structureItem(item);
          if (!portion || !portion.nutrients) return;
          knownItems += 1;
          const foodName = portion.foodName || portion.foodId;
          if (!foodTotals[foodName]) {
            foodTotals[foodName] = {
              name: foodName,
              nutrients: NUTRITION_DB ? NUTRITION_DB.blankNutrients() : {},
              kcal: 0,
              review: false
            };
          }
          foodTotals[foodName].review = foodTotals[foodName].review || Boolean(portion.pendingReview);
          Object.keys(nutrients).forEach(key => {
            nutrients[key] += portion.nutrients[key] || 0;
            foodTotals[foodName].nutrients[key] += portion.nutrients[key] || 0;
            contributions[key][foodName] = (contributions[key][foodName] || 0) + (portion.nutrients[key] || 0);
          });
          foodTotals[foodName].kcal += portion.nutrients.energy || 0;
        });
      });

      return {
        timingState,
        totals,
        nutrients,
        contributions,
        foodTotals,
        coverage: totalItems ? Math.round((knownItems / totalItems) * 100) : 0
      };
    }

    function computeItemsSummary(items) {
      return (items || []).reduce((acc, item) => {
        const portion = structureItem(item);
        if (portion && portion.nutrients) {
          acc.energy += portion.nutrients.energy || 0;
          acc.protein += portion.nutrients.protein || 0;
          acc.fat += portion.nutrients.fat || 0;
          acc.carb += portion.nutrients.carb || 0;
        }
        acc.reviewCount += item.pendingReview ? 1 : 0;
        return acc;
      }, { energy: 0, protein: 0, fat: 0, carb: 0, reviewCount: 0 });
    }

    function summarizeItems(items) {
      return (items || []).map(item => {
        const name = item.foodName || item.foodId;
        return `${name} ${formatQty(item.qty)}${item.unit}`;
      }).join('、');
    }

    function formatQty(value) {
      const num = Number(value) || 0;
      return Number.isInteger(num) ? String(num) : String(Math.round(num * 10) / 10);
    }

    function renderAll() {
      const state = buildDayState();
      document.getElementById('selectedDateLabel').textContent = fmtDate(selectedDate);
      document.getElementById('dateInput').value = selectedDate;
      document.getElementById('todayBtn').classList.toggle('active', selectedDate === todayStr());
      document.getElementById('yesterdayBtn').classList.toggle('active', selectedDate === shiftDate(todayStr(), -1));
      renderHero(state);
      renderMacros(state);
      renderNutrients(state);
      renderSuggestions(state);
      renderTimings(state);
      renderFoods(state);
      renderContributions(state);
    }

    function renderHero(state) {
      const macroSum = state.totals.p + state.totals.f + state.totals.c;
      document.getElementById('heroKcal').textContent = Math.round(state.totals.kcal);
      document.getElementById('heroCount').textContent = `${state.totals.meals}/3 食`;
      document.getElementById('heroPfc').textContent = `${Math.round(state.totals.p)}/${Math.round(state.totals.f)}/${Math.round(state.totals.c)}`;
      document.getElementById('heroCoverage').textContent = `${state.coverage}%`;
      document.getElementById('heroReview').textContent = String(state.totals.reviewCount);
      document.getElementById('coverageChip').textContent = `栄養DB ${state.coverage}%`;
      if (!macroSum && !state.totals.meals) {
        document.getElementById('heroCount').textContent = 'まだ未入力';
      }
    }

    function renderMacros(state) {
      const macroSum = state.totals.p + state.totals.f + state.totals.c;
      const pctP = macroSum ? Math.round((state.totals.p / macroSum) * 100) : 0;
      const pctF = macroSum ? Math.round((state.totals.f / macroSum) * 100) : 0;
      const pctC = macroSum ? Math.round((state.totals.c / macroSum) * 100) : 0;
      document.getElementById('macroP').textContent = `${Math.round(state.totals.p)}g`;
      document.getElementById('macroF').textContent = `${Math.round(state.totals.f)}g`;
      document.getElementById('macroC').textContent = `${Math.round(state.totals.c)}g`;
      document.getElementById('macroPSub').textContent = `${pctP}%`;
      document.getElementById('macroFSub').textContent = `${pctF}%`;
      document.getElementById('macroCSub').textContent = `${pctC}%`;
      document.getElementById('macroMeals').textContent = String(state.totals.meals);
    }

    function renderNutrients(state) {
      const root = document.getElementById('nutrientGrid');
      root.innerHTML = Object.entries(NUTRIENT_META).map(([key, meta]) => {
        const value = state.nutrients[key] || 0;
        const rawPct = meta.target ? Math.round((value / meta.target) * 100) : 0;
        const pct = Math.min(100, rawPct);
        const status = nutrientStatus(key, rawPct, value);
        const leaders = topContributors(state.contributions[key]).slice(0, 2);
        return `
          <div class="nutrient-card">
            <div class="nutrient-head">
              <div class="nutrient-name">${meta.label}</div>
              <div class="status-pill ${status.kind}">${status.label}</div>
            </div>
            <div class="nutrient-value">${formatNutrient(key, value)}${meta.unit}</div>
            <div class="track"><div class="fill" style="width:${pct}%"></div></div>
            <div class="nutrient-meta">${rawPct}% / 目安 ${meta.target}${meta.unit} / ${leaders.length ? leaders.map(item => `${item.name} ${formatNutrient(key, item.value)}${meta.unit}`).join('、') : '寄与食品なし'}</div>
          </div>
        `;
      }).join('');
    }

    function renderTimings(state) {
      const root = document.getElementById('timingGrid');
      const cards = Object.keys(TIMING_LABELS).map(key => {
        const entry = state.timingState[key];
        if (!entry) {
          return `
            <div class="timing-card">
              <div class="timing-top">
                <div class="timing-title">${TIMING_LABELS[key].label}</div>
                <div class="timing-badge">未入力</div>
              </div>
              <div class="timing-copy">まだ何もありません。</div>
            </div>
          `;
        }
        return `
          <div class="timing-card">
            <div class="timing-top">
              <div class="timing-title">${entry.title}</div>
              <div class="timing-badge">${entry.source === 'draft' ? '下書き' : '保存済み'}</div>
            </div>
            <div class="timing-copy">${entry.memo || 'メモなし'}</div>
            <div class="timing-copy" style="color:var(--accent-2)">${Math.round(entry.kcal)}kcal / P${Math.round(entry.p)} / F${Math.round(entry.f)} / C${Math.round(entry.c)}</div>
          </div>
        `;
      });
      root.innerHTML = cards.join('');
    }

    function renderSuggestions(state) {
      const root = document.getElementById('suggestGrid');
      const suggestions = buildFoodSuggestions(state);
      if (!suggestions.length) {
        root.innerHTML = '<div class="empty">今日の入力からは、強い不足候補はまだ出ていません。</div>';
        return;
      }
      root.innerHTML = suggestions.map(item => `
        <a class="suggest-card" href="meal.html?date=${encodeURIComponent(selectedDate)}&panel=builder">
          <div>
            <div class="suggest-title">${item.nutrientLabel}: ${item.foodName}</div>
            <div class="suggest-copy">${item.reason} / 目安の${item.foodPct}%ぶん</div>
          </div>
          <div class="suggest-action">追加へ</div>
        </a>
      `).join('');
    }

    function renderFoods(state) {
      const root = document.getElementById('foodGrid');
      const foods = Object.values(state.foodTotals || {})
        .sort((a, b) => b.kcal - a.kcal)
        .slice(0, 12);
      if (!foods.length) {
        root.innerHTML = '<div class="empty">まだありません。</div>';
        return;
      }
      root.innerHTML = foods.map(food => {
        const strengths = foodStrengths(food.nutrients).slice(0, 4);
        return `
          <div class="food-card">
            <div class="food-card-head">
              <div>
                <div class="food-name">${food.name}</div>
                ${food.review ? '<div class="nutrient-meta">要確認の概算を含みます</div>' : ''}
              </div>
              <div class="food-kcal">${Math.round(food.kcal)}kcal</div>
            </div>
            <div class="food-tags">
              ${strengths.length ? strengths.map(item => `<div class="food-tag">${item.label} ${item.pct}%</div>`).join('') : '<div class="food-tag">栄養DB未整備</div>'}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderContributions(state) {
      const root = document.getElementById('contribList');
      const allRows = Object.entries(NUTRIENT_META).map(([key, meta]) => {
        const top = topContributors(state.contributions[key]).slice(0, 3);
        if (!top.length) {
          return `
            <div class="contrib-row">
              <div>
                <div class="contrib-name">${meta.label}</div>
                <div class="contrib-copy">まだ寄与食品がありません。</div>
              </div>
              <div class="contrib-amount">-</div>
            </div>
          `;
        }
        return top.map(item => `
          <div class="contrib-row">
            <div>
              <div class="contrib-name">${meta.label} / ${item.name}</div>
              <div class="contrib-copy">この栄養の主な寄与食品</div>
            </div>
            <div class="contrib-amount">${formatNutrient(key, item.value)}${meta.unit}</div>
          </div>
        `).join('');
      }).join('');
      root.innerHTML = allRows || '<div class="empty">まだありません。</div>';
    }

    function topContributors(map) {
      return Object.entries(map || {})
        .filter(([, value]) => value > 0)
        .map(([name, value]) => ({ name, value }))
        .sort((a, b) => b.value - a.value);
    }

    function buildFoodSuggestions(state) {
      if (!NUTRITION_DB || !NUTRITION_DB.FOODS) return [];
      const suggestionPriority = [
        'protein', 'fiber', 'Ca', 'Fe', 'Mg', 'K', 'Zn',
        'vitD', 'vitC', 'vitA', 'vitE', 'vitB1', 'vitB2', 'vitB6', 'vitB12', 'folate', 'n3'
      ];
      const priorityRank = Object.fromEntries(suggestionPriority.map((key, index) => [key, index]));
      const weakNutrients = Object.entries(NUTRIENT_META)
        .filter(([key]) => suggestionPriority.includes(key))
        .map(([key, meta]) => {
          const value = state.nutrients[key] || 0;
          const pct = meta.target ? Math.round((value / meta.target) * 100) : 0;
          return { key, meta, pct };
        })
        .filter(item => item.pct < 70)
        .sort((a, b) => (priorityRank[a.key] - priorityRank[b.key]) || (a.pct - b.pct))
        .slice(0, 4);

      return weakNutrients.map(item => {
        const food = bestFoodForNutrient(item.key);
        if (!food) return null;
        const value = foodValueForNutrient(food, item.key);
        const pct = item.meta.target ? Math.round((value / item.meta.target) * 100) : 0;
        return {
          nutrientLabel: item.meta.label,
          foodName: food.name,
          foodPct: pct,
          reason: food.mode === 'perUnit' ? `1${food.unitLabel || '個'}` : defaultFoodUnitLabel(food)
        };
      }).filter(Boolean);
    }

    function bestFoodForNutrient(key) {
      return Object.values(NUTRITION_DB.FOODS)
        .map(food => ({ food, value: foodValueForNutrient(food, key) }))
        .filter(entry => entry.value > 0)
        .sort((a, b) => b.value - a.value)
        .map(entry => entry.food)[0] || null;
    }

    function foodValueForNutrient(food, key) {
      if (!food) return 0;
      if (food.mode === 'perUnit') return food.perUnit[key] || 0;
      const unitLabel = defaultFoodUnitKey(food);
      const grams = food.units && food.units[unitLabel] || 100;
      return (food.per100g[key] || 0) * grams / 100;
    }

    function defaultFoodUnitKey(food) {
      return Object.keys(food.units || {}).find(key => key !== 'g' && key !== 'ml') || Object.keys(food.units || {})[0] || 'g';
    }

    function defaultFoodUnitLabel(food) {
      const key = defaultFoodUnitKey(food);
      return key ? `1${key}` : '1食分';
    }

    function nutrientStatus(key, pct, value) {
      if (!value) return { label: '未摂取', kind: 'low' };
      if (key === 'salt' || key === 'saturatedFat') {
        if (pct > 120) return { label: '多め', kind: 'high' };
        return { label: '適切', kind: 'ok' };
      }
      if (pct < 60) return { label: '不足', kind: 'low' };
      if (pct < 100) return { label: 'もう少し', kind: 'low' };
      if (pct <= 180) return { label: '適切', kind: 'ok' };
      return { label: '多め', kind: 'high' };
    }

    function foodStrengths(nutrients) {
      return Object.entries(NUTRIENT_META)
        .filter(([key]) => key !== 'energy' && key !== 'salt' && key !== 'saturatedFat')
        .map(([key, meta]) => {
          const value = nutrients[key] || 0;
          const pct = meta.target ? Math.round((value / meta.target) * 100) : 0;
          return { key, label: meta.label, pct, value };
        })
        .filter(item => item.value > 0 && item.pct >= 5)
        .sort((a, b) => b.pct - a.pct);
    }

    function formatNutrient(key, value) {
      if (NUTRITION_DB) return NUTRITION_DB.formatValue(key, value);
      const meta = NUTRIENT_META[key] || {};
      const precision = meta.precision || 0;
      return Number(value || 0).toFixed(precision).replace(/\.0$/, '');
    }
  </script>
