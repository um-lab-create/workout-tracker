<!DOCTYPE html>
<!--
  workout_v2.html

  設計コンセプト:
  ジムで片手のまま「種目を選ぶ、前回値を少し直す、記録する」までを最短で終えるための
  Training Cockpit。v1 のカードグリッドを、親指で流せる種目レール + 大きな数値パネル +
  固定アクションバーへ再構成しました。

  v1 から変えたこと:
  - 種目グリッド中心から、現在種目を主役にしたコックピット型 UI へ変更。
  - 前回値、自動入力、今日の記録、保留キューを同じ画面文脈で見える化。
  - no-cors の制約に合わせ、「記録完了」ではなく「送信リクエスト済み」と表現。
  - 再実行・オフライン・再送・localStorage の状態をより分かりやすく整理。

  採用技術の意図:
  依存なしの単一 HTML / CSS / JavaScript。iPhone Safari で軽く動くように、重い Canvas/WebGL
  ではなく transform / opacity 中心の CSS と、イベント委譲による小さな JS で実装しています。

  iPhone で試す手順:
  1. この HTML を iPhone Safari で開く。
  2. 上部の漢字レールから種目を選ぶ。
  3. 前回値が入った状態で、必要なら +/- や数値タップで調整する。
  4. 画面下の「記録する」を押す。オフライン時は保留キューに入り、オンライン復帰で再送します。
-->

<meta name="apple-mobile-web-app-capable" content="yes">

<title>筋トレ記録 v2</title>

<style>
:root {
  --bg: #fff8ef;
  --ink: #1b1d1f;
  --muted: #6b6f76;
  --dim: #a4a8af;
  --line: rgba(0,0,0,.08);
  --panel: #ffffff;
  --panel-strong: #fffefc;
  --glass: rgba(0,0,0,.04);
  --accent: #ff8a2a;
  --accent-soft: rgba(255,138,42,.12);

  --warn: #e4a23a;
  --bad: #e94e5b;

  --radius: 24px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --ease: cubic-bezier(.2,.8,.2,1);
  --spring: cubic-bezier(.34,1.56,.64,1);
}

:root[data-theme="dark"] {
  --bg: #0a0a0f;
  --ink: #f7f4ea;
  --muted: #aaa79d;
  --dim: #6f6d67;
  --line: rgba(255,255,255,.095);
  --panel: rgba(23,24,27,.82);
  --panel-strong: rgba(34,35,39,.94);
  --glass: rgba(255,255,255,.055);
  --accent: #c8ff42;
  --accent-soft: rgba(200,255,66,.16);
  --ok: #42e79b;
  --warn: #ffd15a;
  --bad: #ff5f7f;
  --shadow: 0 22px 70px rgba(0,0,0,.48);
}

* { box-sizing: border-box; }

html,
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overscroll-behavior-y: contain;
  touch-action: manipulation;
}

body {
  min-height: 100vh;
  padding: calc(var(--safe-top) + 10px) 14px calc(var(--safe-bottom) + 112px);
  background:
    radial-gradient(780px 420px at 18% -10%, rgba(255,138,42,.07), transparent 58%),
    radial-gradient(680px 420px at 104% 20%, rgba(92,194,109,.05), transparent 60%),
    linear-gradient(145deg, #fffaf2 0%, #fff8ef 58%, #fffaf2 100%);
}

:root[data-theme="dark"] body {
  background:
    linear-gradient(180deg, rgba(255,255,255,.025), transparent 32%),
    radial-gradient(820px 420px at 20% -12%, rgba(200,255,66,.11), transparent 58%),
    radial-gradient(620px 420px at 104% 18%, rgba(86,185,255,.12), transparent 62%),
    linear-gradient(135deg, #09090d 0%, #101114 54%, #08090d 100%);
}

button,
input {
  font: inherit;
}

button {
  appearance: none;
  border: 0;
  color: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

button:active {
  transform: scale(.97);
}

.app {
  width: min(100%, 520px);
  margin: 0 auto;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin: 4px 0 16px;
}

.brand {
  display: grid;
  gap: 2px;
}

.brand-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-main {
  font-size: 24px;
  line-height: 1;
  font-weight: 900;
  letter-spacing: 0;
}

.brand-sub {
  color: var(--dim);
  font-size: 12px;
  font-weight: 700;
}

.header-tools {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.net-pill {
  min-width: 96px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 11px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--glass);
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
}

.net-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--ok);
  box-shadow: 0 0 18px rgba(66,231,155,.45);
}

.net-pill.offline .net-dot {
  background: var(--bad);
  box-shadow: 0 0 18px rgba(255,95,127,.45);
}

.subtle-nav {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--glass);
  color: var(--ink);
  font-size: 18px;
  font-weight: 900;
  flex: 0 0 auto;
}

.theme-toggle {
  min-width: 44px;
  min-height: 44px;
  display: inline-grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--glass);
  color: var(--ink);
  font-size: 12px;
  font-weight: 950;
}

.hero {
  position: relative;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 28px;
  background:
    linear-gradient(145deg, rgba(255,255,255,.75), rgba(255,255,255,.45)),
    var(--panel);
  box-shadow: var(--shadow);
  padding: 16px;
}

:root[data-theme="dark"] .hero {
  background:
    linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.025)),
    rgba(20,21,25,.78);
}

.hero::before {
  content: "";
  position: absolute;
  inset: -40% -20% auto;
  height: 180px;
  background: radial-gradient(circle, var(--active-soft, rgba(200,255,66,.18)), transparent 68%);
  pointer-events: none;
}

.hero-head {
  position: relative;
  display: grid;
  grid-template-columns: 74px 1fr;
  gap: 14px;
  align-items: center;
}

.glyph {
  width: 74px;
  height: 74px;
  display: grid;
  place-items: center;
  border-radius: 22px;
  background: linear-gradient(150deg, var(--active, var(--accent)), color-mix(in srgb, var(--active, var(--accent)) 62%, #ffffff 0%));
  color: #08090d;
  font-size: 38px;
  line-height: 1;
  font-weight: 950;
  box-shadow: 0 18px 40px var(--active-glow, rgba(200,255,66,.23));
}

.exercise-title {
  margin: 0;
  font-size: 27px;
  line-height: 1.05;
  font-weight: 950;
  letter-spacing: 0;
}

.exercise-meta {
  margin-top: 8px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
}

.quick-stats {
  position: relative;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 16px;
}

.date-card {
  margin-top: 12px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--panel);
  padding: 12px;
}

.date-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.date-title {
  font-size: 12px;
  font-weight: 800;
  color: var(--muted);
}

.date-value {
  margin-top: 4px;
  font-size: 16px;
  font-weight: 900;
}

.date-actions {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-top: 10px;
}

.date-chip,
.date-input {
  min-height: 44px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--glass);
  color: var(--ink);
}

.date-chip {
  font-size: 13px;
  font-weight: 850;
}

.date-chip.active {
  border-color: rgba(200,255,66,.32);
  background: rgba(200,255,66,.14);
}

.date-input {
  width: 100%;
  padding: 0 12px;
  font-size: 14px;
  font-weight: 800;
}

.stat {
  min-height: 68px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--panel);
  padding: 10px;
}

.stat-value {
  font-size: 22px;
  line-height: 1;
  font-weight: 950;
  font-variant-numeric: tabular-nums;
}

.stat-value.hot {
  color: var(--accent);
}

.stat-label {
  margin-top: 6px;
  color: var(--dim);
  font-size: 11px;
  font-weight: 800;
}

.rail-wrap {
  margin: 16px -14px 0;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  padding: 0 14px 2px;
}

.rail-wrap::-webkit-scrollbar {
  display: none;
}

.rail {
  display: flex;
  gap: 10px;
  min-width: max-content;
}

.exo-chip {
  width: 76px;
  min-height: 92px;
  display: grid;
  grid-template-rows: 36px auto auto;
  align-items: center;
  justify-items: center;
  gap: 4px;
  padding: 10px 8px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: rgba(255,255,255,.045);
  transition: transform .16s var(--ease), border-color .2s var(--ease), background .2s var(--ease);
}

.exo-chip.is-active {
  border-color: color-mix(in srgb, var(--chip, var(--accent)) 76%, white 0%);
  background:
    radial-gradient(circle at 50% 4%, color-mix(in srgb, var(--chip, var(--accent)) 30%, transparent), transparent 72%),
    rgba(255,255,255,.07);
}

.exo-kanji {
  color: var(--chip, var(--accent));
  font-size: 31px;
  line-height: 1;
  font-weight: 950;
}

.exo-label {
  color: var(--ink);
  font-size: 10px;
  line-height: 1.1;
  font-weight: 900;
  text-align: center;
}

.exo-prev {
  max-width: 62px;
  color: var(--dim);
  font-size: 9px;
  line-height: 1.1;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.editor {
  margin-top: 14px;
  display: grid;
  gap: 10px;
}

.field-card {
  border: 1px solid var(--line);
  border-radius: 24px;
  background: var(--panel);
  overflow: hidden;
}

.field-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 13px 14px 0;
}

.field-name {
  color: var(--muted);
  font-size: 12px;
  font-weight: 900;
  letter-spacing: .02em;
}

.field-last {
  color: var(--dim);
  font-size: 11px;
  font-weight: 800;
}

.field-last strong {
  color: var(--accent);
}

.control {
  display: grid;
  grid-template-columns: 58px 1fr 58px;
  align-items: center;
  gap: 8px;
  padding: 10px 12px 14px;
}

.step {
  height: 58px;
  border-radius: 18px;
  background: rgba(255,255,255,.065);
  border: 1px solid rgba(255,255,255,.08);
  color: var(--ink);
  font-size: 30px;
  line-height: 1;
  font-weight: 800;
  transition: background .16s var(--ease), color .16s var(--ease), transform .16s var(--ease);
}

.step:active {
  background: var(--active, var(--accent));
  color: #08090d;
}

.value-wrap {
  display: grid;
  justify-items: center;
  gap: 1px;
}

.value-input {
  width: 100%;
  height: 48px;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
  text-align: center;
  font-size: 38px;
  line-height: 1;
  font-weight: 950;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0;
  -webkit-appearance: none;
}

.value-input::-webkit-inner-spin-button,
.value-input::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

.unit {
  color: var(--dim);
  font-size: 10px;
  font-weight: 900;
  letter-spacing: .08em;
}

.summary-line {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
  min-height: 52px;
  margin-top: 12px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: rgba(255,255,255,.04);
  padding: 12px 14px;
}

.summary-label {
  color: var(--dim);
  font-size: 12px;
  font-weight: 900;
}

.summary-value {
  color: var(--ink);
  font-size: 17px;
  font-weight: 950;
  font-variant-numeric: tabular-nums;
}

.action-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 30;
  padding: 12px 14px calc(var(--safe-bottom) + 12px);
  background: linear-gradient(180deg, transparent, rgba(10,10,15,.78) 16%, rgba(10,10,15,.98));
}

.action-inner {
  width: min(100%, 520px);
  margin: 0 auto;
  display: grid;
  grid-template-columns: 56px 1fr 56px;
  gap: 10px;
}

.icon-btn,
.primary-btn {
  height: 58px;
  border-radius: 20px;
  box-shadow: 0 14px 36px rgba(0,0,0,.34);
}

.icon-btn {
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  background: rgba(30,31,35,.92);
  color: var(--muted);
  font-size: 20px;
  font-weight: 950;
}

.icon-btn.has-queue {
  color: var(--warn);
}

.primary-btn {
  display: grid;
  grid-template-columns: 24px 1fr 24px;
  align-items: center;
  padding: 0 18px;
  background: var(--accent);
  color: #08090d;
  font-size: 17px;
  font-weight: 950;
  letter-spacing: 0;
}

.primary-btn.sending {
  background: var(--panel-strong);
  color: var(--muted);
}

.primary-btn.saved {
  background: var(--ok);
}

.primary-btn.queued {
  background: var(--warn);
}

.send-icon {
  font-size: 20px;
  line-height: 1;
}

.sheet {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  align-items: end;
  background: rgba(0,0,0,.52);
  opacity: 0;
  pointer-events: none;
  transition: opacity .22s var(--ease);
}

.sheet.open {
  opacity: 1;
  pointer-events: auto;
}

.sheet-card {
  width: 100%;
  max-height: 78vh;
  overflow: auto;
  border-radius: 28px 28px 0 0;
  background: var(--panel-strong);
  border: 1px solid var(--line);
  border-bottom: 0;
  padding: 10px 16px calc(var(--safe-bottom) + 18px);
  transform: translateY(102%);
  transition: transform .32s var(--spring);
}

.sheet.open .sheet-card {
  transform: translateY(0);
}

.grip {
  width: 38px;
  height: 4px;
  border-radius: 99px;
  background: var(--line);
  margin: 0 auto 14px;
}

.sheet-title {
  margin: 0 0 12px;
  font-size: 18px;
  font-weight: 950;
}

.history-list {
  display: grid;
  gap: 8px;
}

.history-item,
.queue-item {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--glass);
  padding: 12px;
}

.history-main {
  font-size: 14px;
  font-weight: 950;
}

.history-sub {
  margin-top: 3px;
  color: var(--dim);
  font-size: 12px;
  font-weight: 800;
}

.history-time {
  color: var(--muted);
  font-size: 12px;
  font-weight: 900;
}

.empty {
  padding: 28px 8px;
  color: var(--dim);
  text-align: center;
  font-size: 13px;
  font-weight: 800;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--safe-bottom) + 88px);
  z-index: 70;
  transform: translate(-50%, 16px);
  max-width: calc(100vw - 32px);
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(31,32,37,.96);
  color: var(--ink);
  padding: 10px 14px;
  opacity: 0;
  pointer-events: none;
  box-shadow: var(--shadow);
  font-size: 13px;
  font-weight: 900;
  transition: opacity .18s var(--ease), transform .18s var(--spring);
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

.toast.ok { color: var(--ok); }
.toast.warn { color: var(--warn); }
.toast.bad { color: var(--bad); }

/* Compact cockpit: keep the full record flow inside one iPhone Safari screen. */
body {
  min-height: 100dvh;
  padding: calc(var(--safe-top) + 6px) 12px calc(var(--safe-bottom) + 190px);
}

.topbar { margin: 2px 0 8px; }
.brand-main { font-size: 20px; }
.brand-sub { font-size: 11px; }
.net-pill {
  min-width: 82px;
  padding: 6px 10px;
  font-size: 11px;
}

.hero {
  border-radius: 20px;
  padding: 10px;
}

.hero-head {
  grid-template-columns: 48px 1fr;
  gap: 9px;
}

.glyph {
  width: 48px;
  height: 48px;
  border-radius: 16px;
  font-size: 27px;
}

.exercise-title { font-size: 20px; }
.exercise-meta {
  margin-top: 2px;
  font-size: 10px;
}

.quick-stats {
  gap: 6px;
  margin-top: 7px;
}

.stat {
  min-height: 32px;
  border: 0;
  border-radius: 12px;
  padding: 5px 7px;

.stat-value { font-size: 16px; }

  margin-top: 2px;
  font-size: 8px;
}

  margin-top: 7px;
  border-radius: 16px;
  padding: 8px;
}

.date-head {
  display: none;
}

.date-actions {
  grid-template-columns: 58px 58px 1fr;
  gap: 6px;
  margin-top: 0;
}

.date-chip,
.date-input {
  min-height: 44px;
  border-radius: 12px;
  font-size: 12px;

  padding: 0 10px;

.rail-wrap {
  margin: 8px -12px 0;

  .exercise-title { font-size: 20px; }
  .glyph { width: 54px; height: 54px; font-size: 29px; }
  .hero-head { grid-template-columns: 54px 1fr; }
  .control { grid-template-columns: 44px 1fr 44px; }
  .value-input { font-size: 29px; }
  .exo-chip { width: 60px; }
}

@media (max-width: 430px) {
  .date-actions {
    grid-template-columns: 56px 56px minmax(0, 1fr);
  }
  .date-input {
    grid-column: auto;
    min-height: 44px;
  }
  .rail-wrap {
    overflow: visible;
  }
  .rail {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    width: 100%;
  }
  .exo-chip {
    width: 100%;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>
<main class="app" id="app">
  <header class="topbar">
    <div class="brand-row">
      <button class="subtle-nav" type="button" aria-label="Cockpitに戻る" onclick="backToCockpit()">‹</button>
      <div class="brand">
        <div class="brand-main">筋トレ記録</div>
        <div class="brand-sub" id="todayLabel">今日の入力</div>
      </div>
    </div>
    <div class="header-tools">
      <button class="theme-toggle" type="button" data-theme-toggle onclick="CockpitTheme.toggle()">黒</button>
      <div class="net-pill" id="netPill">
        <span class="net-dot"></span>
        <span id="netText">online</span>
      </div>
    </div>
  </header>

  <section class="hero" id="hero">
    <div class="hero-head">
      <div class="glyph" id="activeGlyph">肩</div>
      <div>
        <h1 class="exercise-title" id="activeName">ショルダープレス</h1>
        <div class="exercise-meta" id="activeMeta">前回値を読み込み中</div>
      </div>
    </div>

    <div class="quick-stats">
      <div class="stat">
        <div class="stat-value hot" id="todaySets">0</div>
        <div class="stat-label">この日のセット</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="todayKinds">0</div>
        <div class="stat-label">この日の種目</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="weekDays">0/3</div>
        <div class="stat-label">その週の筋トレ日</div>
      </div>

    <div class="date-card">

          <div class="date-title">記録日</div>

      </div>
      <div class="date-actions">
        <button class="date-chip" type="button" id="todayDateBtn">今日</button>
        <button class="date-chip" type="button" id="yesterdayDateBtn">昨日</button>
        <input class="date-input" type="date" id="recordDateInput" aria-label="記録日">
      </div>
    </div>
  </section>

  <nav class="rail-wrap" aria-label="種目">
    <div class="rail" id="exerciseRail"></div>
  </nav>

  <section class="editor" id="editor"></section>

  <section class="summary-line">
    <div>
      <div class="summary-label">この記録</div>
      <div class="summary-value" id="recordSummary">30kg × 10回 × 3セット</div>
    </div>
    <div class="summary-value" id="volumeSummary">900kg</div>

</main>

<div class="action-bar">
  <div class="action-inner bulk-mode">
    <button class="icon-btn" id="historyBtn" aria-label="選択日の履歴">≡</button>
    <button class="primary-btn" id="submitBtn">
      <span class="send-icon" id="sendIcon">＋</span>

      <span></span>
    </button>
    <button class="primary-btn" id="sendAllBtn">
      <span class="send-icon" id="sendAllIcon">↑</span>
      <span id="sendAllText">送信 0</span>

</div>

<div class="sheet" id="historySheet" aria-hidden="true">
  <div class="sheet-card">
    <div class="grip"></div>
    <h2 class="sheet-title" id="historyTitle">この日の記録</h2>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<div class="sheet" id="queueSheet" aria-hidden="true">
  <div class="sheet-card">
    <div class="grip"></div>
    <h2 class="sheet-title">再送キュー</h2>
    <div class="history-list" id="queueList"></div>
  </div>
</div>

<div class="sheet" id="draftSheet" aria-hidden="true">
  <div class="sheet-card">
    <div class="grip"></div>
    <h2 class="sheet-title">今日の送信予定</h2>
    <div class="history-list" id="draftList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/storage.js"></script>
<script src="js/api-client.js"></script>
<script>
'use strict';

const WEBHOOK = GAS_URL; // api-client.js の GAS_URL を参照
const SHEET = '筋トレログ';
const AUTH_STORE = LS_KEYS.WRITE_AUTH; // storage.js の LS_KEYS を参照

const STORE = {
  last: 'wt:lastValues:v2',
  queue: 'wt:queue:v2',
  draftQueue: 'wt:draftQueue:v1',
  history: 'wt:history:v2',
  selected: 'wt:selectedExercise:v2',
  selectedDate: 'wt:selectedDate:v1'
};

const EXERCISES = [
  { id: 'shoulder', kanji: '肩', name: 'ショルダープレス', short: 'ショルダー', color: '#ff9861', fields: ['weight','reps','sets'], defaults: { weight: 30, reps: 10, sets: 3 } },
  { id: 'chest', kanji: '胸', name: 'チェストプレス', short: 'チェスト', color: '#ff5f7f', fields: ['weight','reps','sets'], defaults: { weight: 40, reps: 10, sets: 3 } },
  { id: 'back', kanji: '背', name: 'ラットプルダウン', short: 'ラットプル', color: '#a889ff', fields: ['weight','reps','sets'], defaults: { weight: 40, reps: 10, sets: 3 } },
  { id: 'leg', kanji: '脚', name: 'レッグプレス', short: 'レッグ', color: '#42e79b', fields: ['weight','reps','sets'], defaults: { weight: 60, reps: 10, sets: 3 } },
  { id: 'inner', kanji: '内', name: 'アダクション', short: 'アダク', color: '#ff8bc7', fields: ['weight','reps','sets'], defaults: { weight: 30, reps: 12, sets: 3 } },
  { id: 'outer', kanji: '外', name: 'アブダクション', short: 'アブダク', color: '#58d8ff', fields: ['weight','reps','sets'], defaults: { weight: 30, reps: 12, sets: 3 } },
  { id: 'abs', kanji: '腹', name: 'アブベンチ', short: 'アブ', color: '#ffd15a', fields: ['reps','sets'], defaults: { reps: 20, sets: 3 } },
  { id: 'run', kanji: '走', name: 'トレッドミル', short: 'ラン', color: '#6ba7ff', fields: ['minutes','distance','intensity'], defaults: { minutes: 20, distance: 2, intensity: 12 } }
];

const FIELD = {
  weight: { label: '重量', unit: 'kg', step: 2.5, min: 0, max: 300, decimals: 1 },
  reps: { label: '回数', unit: '回', step: 1, min: 0, max: 200, decimals: 0 },
  sets: { label: 'セット', unit: 'set', step: 1, min: 1, max: 12, decimals: 0 },
  minutes: { label: '時間', unit: '分', step: 1, min: 0, max: 180, decimals: 0 },
  distance: { label: '距離', unit: 'km', step: .1, min: 0, max: 50, decimals: 1 },
  intensity: { label: '強度', unit: '/20', step: 1, min: 1, max: 20, decimals: 0 }
};

const $ = selector => document.querySelector(selector);

const state = {
  selectedId: load(STORE.selected, 'shoulder'),
  selectedDate: load(STORE.selectedDate, toDateString(new Date())),
  values: {},
  last: mergeLastValues(load(STORE.last, {}), load('wt:lastValues:v1', {})),
  history: load(STORE.history, load('wt:history:v1', [])),
  draftQueue: load(STORE.draftQueue, []),
  queue: load(STORE.queue, load('wt:queue:v1', []))
};

function backToCockpit() {
  if (document.referrer && document.referrer.includes(location.host) && window.history.length > 1) {
    window.history.back();
    return;
  }
  window.location.href = 'index.html';
}

function load(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch {
    return fallback;
  }
}

function save(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch {
    showToast('端末保存に失敗しました', 'bad');
  }
}

function mergeLastValues(primary, legacy) {
  return { ...(legacy || {}), ...(primary || {}) };
}

// loadWritePin / saveWritePin / promptWritePin / makeAuthNonce / buildAuthedPayload
// → api-client.js で定義済み（モジュールのグローバルを使用）

function exoById(id) {
  return EXERCISES.find(exercise => exercise.id === id) || EXERCISES[0];
}

function boot() {
  renderRail();
  selectExercise(state.selectedId, { scroll: false, haptic: false });
  renderStats();
  renderNetwork();
  updateActionButtons();
  bindEvents();
  flushQueue({ silent: true });
}

function bindEvents() {
  $('#exerciseRail').addEventListener('click', event => {
    const button = event.target.closest('[data-exercise]');
    if (!button) return;
    selectExercise(button.dataset.exercise, { scroll: true });
  });

  $('#editor').addEventListener('click', event => {
    const button = event.target.closest('[data-step]');
    if (!button) return;
    changeValue(button.dataset.field, Number(button.dataset.step));
  });

  $('#editor').addEventListener('focusin', event => {
    if (event.target.matches('.value-input')) event.target.select();
  });

  $('#editor').addEventListener('change', event => {
    if (event.target.matches('.value-input')) commitInput(event.target);
  });

  $('#editor').addEventListener('keydown', event => {
    if (event.key !== 'Enter' || !event.target.matches('.value-input')) return;
    event.preventDefault();
    event.target.blur();
  });

  $('#submitBtn').addEventListener('click', addDraftRecord);
  $('#sendAllBtn').addEventListener('click', sendDraftRecords);
  $('#historyBtn').addEventListener('click', openHistory);
  $('#queueBtn').addEventListener('click', openQueue);
  $('#todayDateBtn').addEventListener('click', () => {
    setSelectedDate(toDateString(new Date()));
  });
  $('#yesterdayDateBtn').addEventListener('click', () => {
    setSelectedDate(shiftDateString(toDateString(new Date()), -1));
  });
  $('#recordDateInput').addEventListener('change', event => {
    setSelectedDate(event.target.value);
  });

  $('#historySheet').addEventListener('click', closeSheetOnBackdrop);
  $('#queueSheet').addEventListener('click', closeSheetOnBackdrop);
  $('#draftSheet').addEventListener('click', closeSheetOnBackdrop);
  window.addEventListener('online', () => {
    renderNetwork();
    flushQueue({ silent: false });
  });
  window.addEventListener('offline', renderNetwork);
}

function renderRail() {
  $('#exerciseRail').innerHTML = EXERCISES.map(exercise => {
    const previous = state.last[exercise.id];
    return `
      <button class="exo-chip" data-exercise="${exercise.id}" style="--chip:${exercise.color}">
        <span class="exo-kanji">${exercise.kanji}</span>
        <span class="exo-label">${exercise.short}</span>
        <span class="exo-prev">${previous ? summarizeValues(exercise, previous) : '前回なし'}</span>
      </button>
    `;
  }).join('');
}

function selectExercise(id, options = {}) {
  const exercise = exoById(id);
  state.selectedId = exercise.id;
  save(STORE.selected, exercise.id);
  state.values = {};
  const previous = state.last[exercise.id];
  exercise.fields.forEach(field => {
    state.values[field] = previous && previous[field] != null ? previous[field] : exercise.defaults[field];
  });

  document.documentElement.style.setProperty('--active', exercise.color);
  document.documentElement.style.setProperty('--active-soft', colorWithAlpha(exercise.color, .22));
  document.documentElement.style.setProperty('--active-glow', colorWithAlpha(exercise.color, .30));
  $('#activeGlyph').textContent = exercise.kanji;
  $('#activeName').textContent = exercise.name;
  $('#activeMeta').textContent = previous ? `前回 ${summarizeValues(exercise, previous)}` : '前回記録なし。標準値をセット';

  document.querySelectorAll('.exo-chip').forEach(button => {
    const active = button.dataset.exercise === exercise.id;
    button.classList.toggle('is-active', active);
    if (active && options.scroll) button.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  });

  renderEditor(exercise);
  renderSummary();
  if (options.haptic !== false) haptic(8);
}

function colorWithAlpha(hex, alpha) {
  const value = hex.replace('#', '');
  const r = parseInt(value.slice(0, 2), 16);
  const g = parseInt(value.slice(2, 4), 16);
  const b = parseInt(value.slice(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function renderEditor(exercise) {
  $('#editor').innerHTML = exercise.fields.map(field => {
    const def = FIELD[field];
    const previous = state.last[exercise.id]?.[field];
    const value = state.values[field];
    return `
      <article class="field-card">
        <div class="field-head">
          <div class="field-name">${def.label}</div>
          <div class="field-last">${previous != null ? `前回 <strong>${format(previous, def)}${def.unit}</strong>` : '前回なし'}</div>
        </div>
        <div class="control">
          <button class="step" data-field="${field}" data-step="${-def.step}" aria-label="${def.label}を減らす">−</button>
          <label class="value-wrap">
            <input class="value-input" inputmode="decimal" pattern="[0-9.]*" data-field="${field}" value="${format(value, def)}" aria-label="${def.label}">
            <span class="unit">${def.unit}</span>
          </label>
          <button class="step" data-field="${field}" data-step="${def.step}" aria-label="${def.label}を増やす">＋</button>
        </div>
      </article>
    `;
  }).join('');
}

function changeValue(field, delta) {
  const def = FIELD[field];
  const current = Number(state.values[field]) || 0;
  const next = clamp(current + delta, def.min, def.max);
  state.values[field] = round(next, def.decimals);
  const input = document.querySelector(`.value-input[data-field="${field}"]`);
  if (input) input.value = format(state.values[field], def);
  renderSummary();
  haptic(5);
}

function commitInput(input) {
  const field = input.dataset.field;
  const def = FIELD[field];
  const parsed = parseFloat(String(input.value).replace(',', '.'));
  const safe = Number.isFinite(parsed) ? parsed : state.values[field] ?? def.min;
  state.values[field] = round(clamp(safe, def.min, def.max), def.decimals);
  input.value = format(state.values[field], def);
  renderSummary();
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function round(value, decimals) {
  return Number(value.toFixed(decimals));
}

function format(value, def) {
  const number = Number(value);
  if (!Number.isFinite(number)) return (0).toFixed(def.decimals);
  return number.toFixed(def.decimals);
}

function renderSummary() {
  const exercise = exoById(state.selectedId);
  $('#recordSummary').textContent = summarizeValues(exercise, state.values, true);
  $('#volumeSummary').textContent = volumeSummary(exercise, state.values);
}

function summarizeValues(exercise, values, withUnits = false) {
  if (exercise.id === 'run') {
    const minutes = values.minutes ?? '-';
    const distance = values.distance ?? '-';
    const intensity = values.intensity ?? '-';
    const speed = calculateSpeed(values);
    return withUnits
      ? `${minutes}分 / ${distance}km / 強度${intensity}/20 / 推定${speed}km/h`
      : `${minutes}分 ${distance}km 強度${intensity}`;
  }
  if (exercise.id === 'abs') {
    return `${values.reps ?? '-'}回 × ${values.sets ?? '-'}セット`;
  }
  return withUnits
    ? `${values.weight ?? '-'}kg × ${values.reps ?? '-'}回 × ${values.sets ?? '-'}セット`
    : `${values.weight ?? '-'}kg × ${values.reps ?? '-'} × ${values.sets ?? '-'}`;
}

function volumeSummary(exercise, values) {
  if (exercise.id === 'run') return `推定 ${calculateSpeed(values)}km/h`;
  if (exercise.id === 'abs') return `${(Number(values.reps) || 0) * (Number(values.sets) || 0)}回`;
  const volume = (Number(values.weight) || 0) * (Number(values.reps) || 0) * (Number(values.sets) || 0);
  return `${Math.round(volume).toLocaleString('ja-JP')}kg`;
}

function calculateSpeed(values) {
  const minutes = Number(values.minutes) || 0;
  const distance = Number(values.distance) || 0;
  if (minutes <= 0 || distance <= 0) return '0.0';
  return (distance / minutes * 60).toFixed(1);
}

function addDraftRecord() {
  const exercise = exoById(state.selectedId);
  document.activeElement?.blur();
  const record = buildRecord(exercise);
  const draft = {
    ...record,
    _ts: Date.now(),
    _exerciseId: exercise.id,
    _draft: true
  };
  state.draftQueue.push(draft);
  save(STORE.draftQueue, state.draftQueue);
  setSubmitState('saved');
  updateActionButtons();
  renderStats();
  showToast(`${exercise.short}を送信予定に追加しました`, 'ok');
  haptic([8, 20, 8]);
  setTimeout(() => setSubmitState('ready'), 900);
}

async function sendDraftRecords() {
  document.activeElement?.blur();
  if (state.draftQueue.length === 0) {
    openDraft();
    showToast('送信予定がありません。先に追加してください', 'warn');
    return;
  }
  setSendAllState('sending');
  const sent = [];
  const drafts = state.draftQueue.slice();
  for (let index = 0; index < drafts.length; index += 1) {
    const item = drafts[index];
    try {
      await postRecord(item);
      sent.push(item);
    } catch (error) {
      if (error && error.code === 'AUTH_REQUIRED') {
        setSendAllState('ready');
        showToast('PIN を設定してから送信してください', 'warn');
        state.draftQueue = drafts.slice(index);
        save(STORE.draftQueue, state.draftQueue);
        updateActionButtons();
        return;
      }
      state.queue.push({ ...item, _queuedAt: Date.now() });
    }
  }
  sent.forEach(item => rememberSentRecord(item));
  state.draftQueue = [];
  save(STORE.draftQueue, state.draftQueue);
  save(STORE.queue, state.queue);
  setSendAllState(sent.length ? 'saved' : 'queued');
  updateActionButtons();
  renderStats();
  showToast(sent.length ? `${sent.length}件をまとめて送信しました` : '通信できないため再送キューへ移しました', sent.length ? 'ok' : 'warn');
  haptic(sent.length ? [8, 24, 8] : [20, 40, 20]);
  setTimeout(() => setSendAllState('ready'), 1400);
}

function buildRecord(exercise) {
  return {
    sheet: SHEET,
    日付: state.selectedDate,
    種目: exercise.name,
    重量: state.values.weight ?? '',
    回数: state.values.reps ?? '',
    セット数: state.values.sets ?? '',
    時間: state.values.minutes ?? '',
    距離: state.values.distance ?? '',
    速さ: exercise.id === 'run' ? calculateSpeed(state.values) : '',
    _intensity: exercise.id === 'run' ? state.values.intensity ?? '' : ''
  };
}

function postRecord(record, options = {}) {
  return fetch(WEBHOOK, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(buildAuthedPayload(publicRecord(record), options))
  });
}

function publicRecord(record) {
  return Object.fromEntries(Object.entries(record).filter(([key]) => !key.startsWith('_')));
}

function rememberRecord(exercise, record, options = {}) {
  state.last[exercise.id] = { ...state.values };
  save(STORE.last, state.last);

  state.history.unshift({
    ...record,
    _ts: Date.now(),
    _exerciseId: exercise.id,
    _queued: Boolean(options.queued)
  });
  state.history = state.history.slice(0, 80);
  save(STORE.history, state.history);

  renderRail();
  document.querySelectorAll('.exo-chip').forEach(button => {
    button.classList.toggle('is-active', button.dataset.exercise === exercise.id);
  });
  renderStats();
}

function rememberSentRecord(record, options = {}) {
  const exercise = EXERCISES.find(ex => ex.id === record._exerciseId || ex.name === record.種目) || exoById(state.selectedId);
  const values = valuesFromRecord(exercise, record);
  const { _draft, ...cleanRecord } = record;
  state.last[exercise.id] = values;
  save(STORE.last, state.last);

  state.history.unshift({
    ...cleanRecord,
    _ts: record._ts || Date.now(),
    _exerciseId: exercise.id,
    _queued: Boolean(options.queued)
  });
  state.history = state.history.slice(0, 80);
  save(STORE.history, state.history);

  renderRail();
  document.querySelectorAll('.exo-chip').forEach(button => {
    button.classList.toggle('is-active', button.dataset.exercise === state.selectedId);
  });
}

function valuesFromRecord(exercise, record) {
  const values = {};
  if (exercise.fields.includes('weight')) values.weight = Number(record.重量) || 0;
  if (exercise.fields.includes('reps')) values.reps = Number(record.回数) || 0;
  if (exercise.fields.includes('sets')) values.sets = Number(record.セット数) || 0;
  if (exercise.fields.includes('minutes')) values.minutes = Number(record.時間) || 0;
  if (exercise.fields.includes('distance')) values.distance = Number(record.距離) || 0;
  if (exercise.fields.includes('intensity')) values.intensity = Number(record._intensity) || FIELD.intensity.min;
  return values;
}

function setSubmitState(stateName) {
  const button = $('#submitBtn');
  const text = $('#submitText');
  const icon = $('#sendIcon');
  button.classList.remove('sending', 'saved', 'queued');

  if (stateName === 'sending') {
    button.classList.add('sending');
    text.textContent = '追加中';
    icon.textContent = '…';
  } else if (stateName === 'saved') {
    button.classList.add('saved');
    text.textContent = '追加済み';
    icon.textContent = '✓';
  } else if (stateName === 'queued') {
    button.classList.add('queued');
    text.textContent = '再送待ち';
    icon.textContent = '!';
  } else {
    text.textContent = '追加';
    icon.textContent = '＋';
  }
}

function setSendAllState(stateName) {
  const button = $('#sendAllBtn');
  const text = $('#sendAllText');
  const icon = $('#sendAllIcon');
  button.classList.remove('sending', 'saved', 'queued');
  if (stateName === 'sending') {
    button.classList.add('sending');
    text.textContent = '送信中';
    icon.textContent = '…';
  } else if (stateName === 'saved') {
    button.classList.add('saved');
    text.textContent = '送信済み';
    icon.textContent = '✓';
  } else if (stateName === 'queued') {
    button.classList.add('queued');
    text.textContent = '再送待ち';
    icon.textContent = '!';
  } else {
    text.textContent = `送信 ${state.draftQueue.length}`;
    icon.textContent = '↑';
  }
}

function renderStats() {
  const selected = state.selectedDate;
  const todays = state.history.filter(item => item.日付 === selected).concat(state.draftQueue.filter(item => item.日付 === selected));
  const sets = todays.reduce((sum, item) => sum + (Number(item.セット数) || 0), 0);
  const kinds = new Set(todays.map(item => item.種目)).size;

  $('#todaySets').textContent = sets;
  $('#todayKinds').textContent = kinds;

  const monday = startOfWeek(parseLocalDate(selected));
  const weekDates = new Set();
  state.history.concat(state.draftQueue).forEach(item => {
    const date = parseLocalDate(item.日付);
    if (date >= monday && isWeightedExerciseName(item.種目)) weekDates.add(item.日付);
  });
  $('#weekDays').textContent = `${weekDates.size}/3`;
  $('#weekDays').classList.toggle('hot', weekDates.size >= 3);
  const selectedDate = parseLocalDate(selected);
  $('#todayLabel').textContent = `${formatJapaneseDate(selectedDate)} の入力`;
  $('#selectedDateLabel').textContent = formatJapaneseDate(selectedDate);
  $('#recordDateInput').value = selected;
  $('#todayDateBtn').classList.toggle('active', selected === toDateString(new Date()));
  $('#yesterdayDateBtn').classList.toggle('active', selected === shiftDateString(toDateString(new Date()), -1));
}

function isWeightedExerciseName(name) {
  return name !== 'トレッドミル' && name !== 'アブベンチ';
}

function toDateString(date) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
}

function parseLocalDate(value) {
  const [year, month, day] = String(value).split('-').map(Number);
  return new Date(year, (month || 1) - 1, day || 1);
}

function startOfWeek(date) {
  const monday = new Date(date);
  const day = (monday.getDay() + 6) % 7;
  monday.setDate(monday.getDate() - day);
  monday.setHours(0, 0, 0, 0);
  return monday;
}

function formatJapaneseDate(date) {
  const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
  return `${date.getMonth() + 1}/${date.getDate()} (${dayNames[date.getDay()]})`;
}

function shiftDateString(dateStr, diffDays) {
  const date = parseLocalDate(dateStr);
  date.setDate(date.getDate() + diffDays);
  return toDateString(date);
}

function setSelectedDate(dateStr) {
  if (!dateStr) return;
  state.selectedDate = dateStr;
  save(STORE.selectedDate, state.selectedDate);
  renderStats();
}

function openHistory() {
  renderHistory();
  openSheet('#historySheet');
}

function renderHistory() {
  const todays = state.draftQueue.filter(item => item.日付 === state.selectedDate)
    .concat(state.history.filter(item => item.日付 === state.selectedDate));
  $('#historyTitle').textContent = `${formatJapaneseDate(parseLocalDate(state.selectedDate))} の記録`;
  $('#historyList').innerHTML = todays.length
    ? todays.map(historyItemHtml).join('')
    : '<div class="empty">この日の記録はまだありません</div>';
}

function historyItemHtml(item) {
  const time = item._ts ? new Date(item._ts) : null;
  const hhmm = time ? `${String(time.getHours()).padStart(2, '0')}:${String(time.getMinutes()).padStart(2, '0')}` : '';
  const exercise = EXERCISES.find(ex => ex.name === item.種目) || {};
  const sub = item.種目 === 'トレッドミル'
    ? `${item.時間 || '-'}分 / ${item.距離 || '-'}km / 強度${item._intensity || '-'}/20 / 推定${item.速さ || '-'}km/h`
    : item.種目 === 'アブベンチ'
      ? `${item.回数 || '-'}回 × ${item.セット数 || '-'}セット`
      : `${item.重量 || '-'}kg × ${item.回数 || '-'}回 × ${item.セット数 || '-'}セット`;
  return `
    <div class="history-item">
      <div>
        <div class="history-main">${exercise.kanji ? `${exercise.kanji} ` : ''}${item.種目}${item._draft ? ' / 送信予定' : item._queued ? ' / 再送待ち' : ''}</div>
        <div class="history-sub">${sub}</div>
      </div>
      <div class="history-time">${hhmm}</div>
    </div>
  `;
}

function openQueue() {
  renderQueue();
  openSheet('#queueSheet');
}

function openDraft() {
  renderDraft();
  openSheet('#draftSheet');
}

function renderQueue() {
  $('#queueList').innerHTML = state.queue.length
    ? state.queue.map((item, index) => `
      <div class="queue-item">
        <div>
          <div class="history-main">${item.種目}</div>
          <div class="history-sub">${item.日付} / ${queueSummary(item)}</div>
        </div>
        <button class="icon-btn" style="width:48px;height:42px" onclick="retryOne(${index})" aria-label="この記録を再送">↻</button>
      </div>
    `).join('')
    : '<div class="empty">再送待ちはありません</div>';
}

function renderDraft() {
  $('#draftList').innerHTML = state.draftQueue.length
    ? state.draftQueue.map((item, index) => `
      <div class="queue-item">
        <div>
          <div class="history-main">${item.種目}</div>
          <div class="history-sub">${item.日付} / ${queueSummary(item)}</div>
        </div>
        <button class="icon-btn" style="width:48px;height:42px" onclick="removeDraft(${index})" aria-label="この送信予定を削除">×</button>
      </div>
    `).join('')
    : '<div class="empty">送信予定はありません</div>';
}

function queueSummary(item) {
  if (item.種目 === 'トレッドミル') return `${item.時間 || '-'}分 ${item.距離 || '-'}km 強度${item._intensity || '-'}/20`;
  if (item.種目 === 'アブベンチ') return `${item.回数 || '-'}回 × ${item.セット数 || '-'}`;
  return `${item.重量 || '-'}kg × ${item.回数 || '-'} × ${item.セット数 || '-'}`;
}

window.retryOne = async function retryOne(index) {
  const item = state.queue[index];
  if (!item) return;
  try {
    await postRecord(item);
    state.queue.splice(index, 1);
    save(STORE.queue, state.queue);
    updateActionButtons();
    renderQueue();
    showToast('1件を再送しました', 'ok');
  } catch {
    showToast('まだ送れません。通信を確認してください', 'bad');
  }
};

window.removeDraft = function removeDraft(index) {
  state.draftQueue.splice(index, 1);
  save(STORE.draftQueue, state.draftQueue);
  updateActionButtons();
  renderDraft();
  renderStats();
  showToast('送信予定から削除しました', 'ok');
};

async function flushQueue(options = {}) {
  if (!navigator.onLine || state.queue.length === 0) return;
  const remaining = [];
  for (const item of state.queue) {
    try {
      await postRecord(item, { allowPrompt: !options.silent });
    } catch (error) {
      remaining.push(item);
      if (error && error.code === 'AUTH_REQUIRED') break;
    }
  }
  const sent = state.queue.length - remaining.length;
  state.queue = remaining;
  save(STORE.queue, state.queue);
  updateActionButtons();
  if (!options.silent && sent > 0) showToast(`${sent}件を再送しました`, 'ok');
}

function updateActionButtons() {
  const retryButton = $('#queueBtn');
  retryButton.classList.toggle('has-queue', state.queue.length > 0);
  retryButton.textContent = state.queue.length > 0 ? String(state.queue.length) : '↻';
  retryButton.setAttribute('aria-label', state.queue.length > 0 ? `再送キュー ${state.queue.length}件` : '再送キュー');
  setSendAllState('ready');
  $('#sendAllBtn').classList.toggle('has-queue', state.draftQueue.length > 0);
  $('#sendAllBtn').setAttribute('aria-label', state.draftQueue.length > 0 ? `送信予定 ${state.draftQueue.length}件をまとめて送信` : '送信予定を見る');
}

function openSheet(selector) {
  const sheet = $(selector);
  sheet.classList.add('open');
  sheet.setAttribute('aria-hidden', 'false');
}

function closeSheetOnBackdrop(event) {
  if (!event.target.classList.contains('sheet')) return;
  event.target.classList.remove('open');
  event.target.setAttribute('aria-hidden', 'true');
}

function renderNetwork() {
  const online = navigator.onLine;
  $('#netPill').classList.toggle('offline', !online);
  $('#netText').textContent = online ? 'online' : 'offline';
}

function showToast(message, kind) {
  const toast = $('#toast');
  toast.textContent = message;
  toast.className = `toast show ${kind || ''}`;
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => {
    toast.className = 'toast';
  }, 2100);
}

function haptic(pattern) {
  if ('vibrate' in navigator) navigator.vibrate(pattern);
}

boot();
</script>
</body>
</html>
