<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>体組成記録</title>
<link rel="icon" href="icons/cockpit.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    /* 2026-05-27 (cowork) body.html もライト暖色テーマに統一 */
    --bg: #fff8ef;
    --ink: #1b1d1f;
    --muted: #6b6f76;
    --dim: #a4a8af;
    --line: rgba(0,0,0,.08);
    --panel: #ffffff;
    --panel-strong: #fffefc;
    --accent: #ff8a2a;
    --accent-soft: rgba(255,138,42,.12);
    --accent-2: #5cc26d;
    --warn: #e4a23a;
    --ok: #2eb872;
    --bubble: #fff5e0;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Maru Gothic Pro", "Yu Gothic", "Noto Sans JP", "Hiragino Sans", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    letter-spacing: .01em;
    line-height: 1.6;
    padding: calc(16px + var(--safe-top)) 16px calc(40px + var(--safe-bottom));
    max-width: 560px; margin-inline: auto;
  }
  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .subtle-nav {
    width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); font-size: 20px; cursor: pointer;
  }
  .brand-main { font-size: 18px; font-weight: 800; }
  .brand-sub { font-size: 12px; color: var(--muted); }
  .chip {
    margin-left: auto; font-size: 12px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; background: var(--panel);
  }
  .chip.synced { color: var(--ok); border-color: rgba(66,231,155,.35); }
  .chip.error { color: var(--warn); border-color: rgba(255,209,90,.35); }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
    padding: 18px; margin-bottom: 16px;
  }
  .panel-title { font-size: 13px; color: var(--muted); font-weight: 700; margin-bottom: 12px; }
  .field { margin-bottom: 14px; }
  .field-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  input[type="date"], input[type="number"], textarea {
    width: 100%; background: var(--panel-strong); border: 1px solid var(--line);
    border-radius: 14px; color: var(--ink); font-size: 17px; padding: 13px 14px; font-family: inherit;
  }
  textarea { min-height: 60px; resize: vertical; }
  .num-row { display: flex; gap: 10px; }
  .num-row .field { flex: 1; margin-bottom: 0; }
  .unit-hint { font-size: 11px; color: var(--dim); margin-top: 4px; }
  .cond-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .cond-btn {
    border: 1px solid var(--line); background: var(--panel-strong); color: var(--muted);
    border-radius: 14px; padding: 12px 4px; font-size: 13px; cursor: pointer; text-align: center;
  }
  .cond-btn .emo { display: block; font-size: 18px; margin-bottom: 2px; }
  .cond-btn.active { border-color: var(--accent); color: var(--ink); background: var(--accent-soft); }
  .save-btn {
    width: 100%; border: none; border-radius: 16px; padding: 16px;
    background: var(--accent-2); color: #15210a; font-size: 17px; font-weight: 800; cursor: pointer;
  }
  .save-btn:disabled { opacity: .5; }
  .recent-item {
    display: flex; align-items: baseline; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line);
  }
  .recent-item:last-child { border-bottom: none; }
  .recent-date { font-size: 12px; color: var(--muted); min-width: 78px; }
  .recent-main { font-size: 15px; font-weight: 700; }
  .recent-sub { font-size: 12px; color: var(--muted); margin-left: auto; }
  .delta-up { color: var(--warn); }
  .delta-down { color: var(--ok); }
  .empty { color: var(--dim); font-size: 13px; }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + var(--safe-bottom));
    background: var(--panel-strong); border: 1px solid var(--line); color: var(--ink);
    padding: 12px 18px; border-radius: 14px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  @media (max-width: 430px) {
    .num-row { flex-direction: column; }
    .cond-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cond-btn:last-child { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <button class="subtle-nav" type="button" aria-label="Cockpitに戻る" onclick="backToCockpit()">‹</button>
    <div>
      <div class="brand-main">体組成記録</div>
      <div class="brand-sub">体重・体脂肪率・調子を記録</div>
    </div>
    <div class="chip" id="syncChip">待機中</div>
  </div>

  <section class="panel">
    <div class="panel-title">記録</div>
    <div class="field">
      <div class="field-label">記録日</div>
      <input type="date" id="dateInput">
    </div>
    <div class="num-row">
      <div class="field">
        <div class="field-label">体重</div>
        <input type="number" id="weightInput" inputmode="decimal" step="0.1" min="20" max="200" placeholder="例 67.0">
        <div class="unit-hint">kg</div>
      </div>
      <div class="field">
        <div class="field-label">体脂肪率</div>
        <input type="number" id="fatInput" inputmode="decimal" step="0.1" min="3" max="60" placeholder="例 17.0">
        <div class="unit-hint">%（北極星KPI）</div>
      </div>
    </div>
    <div class="field">
      <div class="field-label">調子</div>
      <div class="cond-grid" id="condGrid"></div>
    </div>
    <div class="field">
      <div class="field-label">メモ（任意）</div>
      <textarea id="memoInput" placeholder="睡眠・むくみ・食べ過ぎ など"></textarea>
    </div>
    <button class="save-btn" id="saveBtn" type="button" onclick="saveBody()">記録する</button>
  </section>

  <section class="panel">
    <div class="panel-title">最近の記録（この端末）</div>
    <div id="recentList"><div class="empty">まだ記録がありません。</div></div>
  </section>

  <div class="toast" id="toast"></div>

<script src="js/storage.js"></script>
<script src="js/api-client.js"></script>
<script>
  'use strict';
  // GAS_URL / postToSheet / lsGet / lsSet などは js/storage.js + js/api-client.js が提供（inlineで再宣言しない）
  const BODY_STORE = 'body_recs_v1';
  const SHEET_NAME = '体組成ログ手動';
  const CONDITIONS = [
    { v: 5, label: '絶好調', emo: '◎' },
    { v: 4, label: '好調', emo: '○' },
    { v: 3, label: '普通', emo: '–' },
    { v: 2, label: 'いまいち', emo: '▽' },
    { v: 1, label: '不調', emo: '×' }
  ];
  let selectedCond = 3;

  function todayStr() {
    const d = new Date();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${d.getFullYear()}-${m}-${day}`;
  }

  function setSync(state, text) {
    const el = document.getElementById('syncChip');
    el.className = 'chip' + (state ? ' ' + state : '');
    el.textContent = text;
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  function renderConditions() {
    const grid = document.getElementById('condGrid');
    grid.innerHTML = CONDITIONS.map(c =>
      `<button class="cond-btn${c.v === selectedCond ? ' active' : ''}" type="button" data-v="${c.v}">
        <span class="emo">${c.emo}</span>${c.label}</button>`
    ).join('');
    grid.querySelectorAll('.cond-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedCond = Number(btn.dataset.v);
        renderConditions();
      });
    });
  }

  function fmtDate(iso) {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    const days = ['日', '月', '火', '水', '木', '金', '土'];
    return `${d.getMonth() + 1}/${d.getDate()} (${days[d.getDay()]})`;
  }

  function condLabel(v) {
    const c = CONDITIONS.find(x => x.v === Number(v));
    return c ? c.label : '';
  }

  function renderRecent() {
    const recs = (lsGet(BODY_STORE, []) || []).slice().sort((a, b) => (a.date < b.date ? 1 : -1));
    const el = document.getElementById('recentList');
    if (!recs.length) { el.innerHTML = '<div class="empty">まだ記録がありません。</div>'; return; }
    el.innerHTML = recs.slice(0, 12).map((r, i) => {
      const prev = recs[i + 1];
      let delta = '';
      if (prev && r.weight && prev.weight) {
        const d = Math.round((r.weight - prev.weight) * 10) / 10;
        if (d !== 0) delta = `<span class="${d < 0 ? 'delta-down' : 'delta-up'}">${d > 0 ? '+' : ''}${d}kg</span>`;
      }
      const fat = r.fat ? ` / 体脂肪 ${r.fat}%` : '';
      return `<div class="recent-item">
        <span class="recent-date">${fmtDate(r.date)}</span>
        <span class="recent-main">${r.weight ? r.weight + 'kg' : '—'}${fat}</span>
        <span class="recent-sub">${condLabel(r.cond)} ${delta}</span>
      </div>`;
    }).join('');
  }

  async function saveBody() {
    const date = document.getElementById('dateInput').value || todayStr();
    const weight = parseFloat(document.getElementById('weightInput').value) || 0;
    const fat = parseFloat(document.getElementById('fatInput').value) || 0;
    const memo = document.getElementById('memoInput').value.trim();
    if (!weight && !fat) { showToast('体重か体脂肪率を入れてください'); return; }

    const btn = document.getElementById('saveBtn');
    btn.disabled = true; btn.textContent = '送信中...';
    setSync('', '送信中');

    const record = { date, weight, fat, cond: selectedCond, memo, ts: Date.now() };

    // 端末ローカルに保存（即時表示・オフライン耐性）
    const recs = lsGet(BODY_STORE, []) || [];
    recs.push(record);
    lsSet(BODY_STORE, recs);
    renderRecent();

    // スプレッドシートへ送信（WRITE_PIN 認証付き・no-cors。eufyの体組成ログには触れず手動シートへ）
    try {
      await postToSheet({
        sheet: SHEET_NAME,
        '日付': date,
        '体重kg': weight || '',
        '体脂肪率%': fat || '',
        '調子': condLabel(selectedCond),
        'メモ': memo
      });
      setSync('synced', '同期済み');
      showToast('記録しました');
    } catch (err) {
      if (err && err.code === 'AUTH_REQUIRED') {
        setSync('', '待機中');
        showToast('PIN を設定してから送信してください');
      } else {
        setSync('error', '送信は後で再試行');
        showToast('オフライン保存しました（後で自動送信）');
      }
    } finally {
      btn.disabled = false; btn.textContent = '記録する';
      document.getElementById('memoInput').value = '';
      setTimeout(() => setSync('', '待機中'), 2600);
    }
  }

  function backToCockpit() {
    location.href = 'index.html';
  }

  // 初期化
  document.getElementById('dateInput').value = todayStr();
  renderConditions();
  renderRecent();
  if (typeof flushPendingQueue === 'function') flushPendingQueue();
</script>
</body>
</html>
